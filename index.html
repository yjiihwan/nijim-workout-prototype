<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>니짐내짐 운동기록 · 캐릭터 성장 프로토타입 v1.20</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css">

<body>
<div class="app" id="app">
  <header class="top">
    <div class="logo">N 니짐내짐</div>
    <div class="ver">프로토타입 v1.20</div>
  </header>
  <main id="view"></main>
  <!-- 하단탭 5개 (결정 20) — 실제 앱 캡슐 탭바 규격(design 10-25). 운동기록 = 정식 A 사선 덤벨, 기존 4칸은 대조용 재현(실앱은 원본 에셋) -->
  <nav class="tabbar" id="tabbar" aria-label="하단 메뉴">
    <button data-tab="home" aria-label="홈"><svg viewBox="0 0 26 26" aria-hidden="true"><path d="M2 24.4V11.4Q2 10.6 2.7 10L12.2 2.4Q13 1.8 13.8 2.4L23.3 10Q24 10.6 24 11.4V24.4H16.7V17.3H9.3V24.4Z"/></svg><span>홈</span></button>
    <button data-tab="nearby" aria-label="내주변"><svg viewBox="0 0 26 26" aria-hidden="true"><circle cx="13" cy="13" r="7.6"/><circle cx="13" cy="13" r="3.7" fill="currentColor" stroke="none"/><path d="M13 1.6V5.4M13 20.6V24.4M1.6 13H5.4M20.6 13H24.4" stroke-linecap="butt"/></svg><span>내주변</span></button>
    <button data-tab="membership" aria-label="멤버십"><svg viewBox="0 0 26 26" aria-hidden="true"><g transform="rotate(-14 13 13) translate(13 13) scale(1.1) translate(-13 -13)" stroke-width="1.818"><rect x="2.6" y="6.4" width="20.8" height="13.6" rx="2.6"/><path d="M2.6 10.8H23.4" stroke-width="2.4"/><circle cx="18.6" cy="15.6" r="1.35" stroke-width="1.6"/></g></svg><span>멤버십</span></button>
    <button data-tab="workout" aria-label="운동기록" id="tabWorkout"><svg viewBox="0 0 26 26" aria-hidden="true"><g transform="translate(13 13) rotate(-45) scale(1.07)" stroke-width="1.869"><rect x="5" y="-6" width="4.6" height="12" rx="1.6"/><rect x="-9.6" y="-6" width="4.6" height="12" rx="1.6"/><rect x="9.6" y="-3.3" width="2.5" height="6.6" rx="1" fill="currentColor" stroke="none"/><rect x="-12.1" y="-3.3" width="2.5" height="6.6" rx="1" fill="currentColor" stroke="none"/><path d="M-5 0H5" stroke-linecap="butt"/></g></svg><span>운동기록</span></button>
    <button data-tab="all" aria-label="전체"><svg viewBox="0 0 26 26" aria-hidden="true"><path d="M1.5 4.7H24.5M1.5 13H24.5M1.5 21.3H24.5" stroke-linecap="butt"/></svg><span>전체</span></button>
  </nav>
  <div class="toast" id="toast"></div>
  <div class="sheet" id="sheet"></div>
</div>

<div class="evo" id="evo" aria-hidden="true">
  <div class="evo-bg"></div>
  <div class="evo-rays"></div>
  <div class="evo-top">
    <button class="evo-sound" id="evoSound" aria-label="소리">🔊</button>
    <span class="evo-tag" id="evoTag"></span>
    <button class="evo-skip" id="evoSkip">건너뛰기 ›</button>
  </div>
  <div class="evo-stage" id="evoStage">
    <div class="evo-ring" id="evoRing"></div>
    <img class="evo-old" id="evoOld" alt="">
    <img class="evo-new" id="evoNew" alt="">
    <div class="evo-parts" id="evoParts"></div>
  </div>
  <div class="evo-flash" id="evoFlash"></div>
  <div class="evo-cap">
    <div class="evo-lv" id="evoLv"><span id="evoLvNum">Lv.1</span></div>
    <div class="evo-title" id="evoTitle"></div>
    <div class="evo-sub" id="evoSub"></div>
    <button class="evo-ok" id="evoOk">확인</button>
  </div>
  <div class="evo-hint" id="evoHint">화면을 탭하면 건너뛰어요</div>
